# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v1.0.1'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Leader key
unbind C-b
set -g prefix C-t
bind C-t send-prefix

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -s extended-keys on
set -as terminal-features 'xterm-kitty*:extkeys'

set -g @continuum-restore 'on'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

bind '\' split-window -h
bind - split-window -v

bind-key -r t display-popup -w 80% -h 60% -E -b none "bash ~/.local/scripts/tmux-sessionizer"

# Minimalist status bar with Catppuccin Mocha colors
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# Left: session name
set -g status-left '#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] '
set -g status-left-length 30

# Right: git branch + date/time
set -g status-right '#(gitmux "#{pane_current_path}") #[fg=#a6adc8]%Y-%m-%d %H:%M '
set -g status-right-length 80

# Window tabs - inactive
set -g window-status-format '#[fg=#6c7086] #I:#W '

# Window tabs - active (teal accent)
set -g window-status-current-format '#[fg=#94e2d5,bold] #I:#W '

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'

# Messages
set -g message-style 'bg=#cba6f7 fg=#1e1e2e bold'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
